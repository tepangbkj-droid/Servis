<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotorCare Pro - Tracker Perawatan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); }
        .progress-bar { transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-12">

    <!-- Header Section -->
    <div class="bg-indigo-700 text-white pt-10 pb-20 px-6 rounded-b-[3rem] shadow-2xl relative">
        <div class="max-w-md mx-auto relative z-10">
            <div class="flex items-center justify-between mb-6">
                <h1 class="text-2xl font-black italic tracking-tighter">MOTORCARE <span class="text-indigo-300 underline">PRO</span></h1>
                <div id="syncIndicator" class="text-[10px] bg-indigo-800 px-2 py-1 rounded-full text-indigo-200">Auto-Save Active</div>
            </div>
            
            <p class="text-indigo-100 text-sm mb-4">Input Total Mileage dari Secumore:</p>
            <div class="flex gap-2 bg-white/10 p-1.5 rounded-2xl border border-white/20 backdrop-blur-sm">
                <input type="number" id="currentOdo" placeholder="Contoh: 12500" 
                       class="bg-transparent w-full px-4 py-2 text-white placeholder-indigo-300 font-bold text-lg outline-none">
                <button onclick="updateCalculations()" class="bg-white text-indigo-700 px-6 py-2 rounded-xl font-bold hover:bg-indigo-50 transition active:scale-95">
                    Update
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="max-w-md mx-auto px-4 -mt-10 relative z-20">
        <div id="maintenanceCards" class="grid grid-cols-1 gap-4">
            <!-- Cards generated by JS -->
        </div>

        <!-- Action Tools -->
        <div class="mt-10 space-y-3">
            <button onclick="copyShareLink()" class="w-full bg-white border-2 border-indigo-600 text-indigo-600 py-4 rounded-2xl font-bold flex items-center justify-center gap-2 hover:bg-indigo-50 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
                </svg>
                Backup Data ke Link
            </button>
            <p class="text-[10px] text-center text-slate-400 px-6">Gunakan tombol di atas untuk memindahkan data ke perangkat baru atau sebagai cadangan di catatan HP Anda.</p>
        </div>
    </main>

    <!-- Modal Reset -->
    <div id="resetModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4 z-50">
        <div class="bg-white w-full max-w-sm rounded-t-[2rem] sm:rounded-[2.5rem] p-8 shadow-2xl animate-bounce-short">
            <h3 class="text-xl font-black text-slate-800 mb-2" id="modalTitle">Reset Komponen</h3>
            <p class="text-slate-500 text-sm mb-6">Berapa kilometer pada Odometer saat penggantian ini?</p>
            <input type="number" id="modalOdo" class="w-full bg-slate-100 p-4 rounded-2xl text-2xl font-bold text-slate-800 outline-none focus:ring-2 focus:ring-indigo-600 mb-6">
            <div class="flex gap-3">
                <button onclick="closeModal()" class="flex-1 py-4 font-bold text-slate-400">Batal</button>
                <button onclick="confirmReset()" class="flex-1 py-4 bg-indigo-600 text-white rounded-2xl font-bold shadow-lg shadow-indigo-200">Simpan Data</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-8 py-3 rounded-full text-xs font-bold shadow-2xl opacity-0 transition-all duration-500 pointer-events-none z-[60]">
        Berhasil!
    </div>

    <script>
        // Configuration
        const MAINTENANCE_CONFIG = {
            oil: { name: 'Oli Mesin', interval: 2500, icon: '🛢️' },
            gardan: { name: 'Oli Gardan', interval: 8000, icon: '⚙️' },
            filter: { name: 'Filter Udara', interval: 12000, icon: '🌬️' },
            vbelt: { name: 'V-Belt / Rantai', interval: 20000, icon: '⛓️' },
            coolant: { name: 'Air Radiator', interval: 10000, icon: '💧' }
        };

        let appData = {
            currentOdo: 0,
            history: { oil: 0, gardan: 0, filter: 0, vbelt: 0, coolant: 0 }
        };

        let activeKey = '';

        // --- STORAGE ENGINES ---
        function setCookie(name, value) {
            const d = new Date();
            d.setTime(d.getTime() + (365*24*60*60*1000));
            document.cookie = `${name}=${btoa(JSON.stringify(value))};expires=${d.toUTCString()};path=/`;
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for(let i=0;i < ca.length;i++) {
                let c = ca[i];
                while (c.charAt(0)==' ') c = c.substring(1,c.length);
                if (c.indexOf(nameEQ) == 0) return JSON.parse(atob(c.substring(nameEQ.length,c.length)));
            }
            return null;
        }

        function saveAll() {
            localStorage.setItem('motorCareData', JSON.stringify(appData));
            setCookie('motorCareData', appData);
        }

        // --- CORE FUNCTIONS ---
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const shared = urlParams.get('data');

            if (shared) {
                try {
                    appData = JSON.parse(atob(shared));
                    saveAll();
                    window.history.replaceState({}, document.title, window.location.pathname);
                    showToast("Data Backup Berhasil Dimuat!");
                } catch(e) { console.error("Data error"); }
            } else {
                const saved = getCookie('motorCareData') || JSON.parse(localStorage.getItem('motorCareData'));
                if (saved) appData = saved;
            }

            document.getElementById('currentOdo').value = appData.currentOdo || '';
            renderUI();
        };

        function renderUI() {
            const container = document.getElementById('maintenanceCards');
            container.innerHTML = '';
            const current = appData.currentOdo || 0;

            Object.keys(MAINTENANCE_CONFIG).forEach(key => {
                const cfg = MAINTENANCE_CONFIG[key];
                const last = appData.history[key] || 0;
                const used = Math.max(0, current - last);
                const remain = Math.max(0, cfg.interval - used);
                const health = Math.max(0, 100 - ((used / cfg.interval) * 100));

                let color = "bg-emerald-500";
                let textStatus = "Kondisi Baik";
                let bgBadge = "bg-emerald-100 text-emerald-700";

                if (health < 15) {
                    color = "bg-red-500";
                    textStatus = "Ganti Sekarang!";
                    bgBadge = "bg-red-100 text-red-700";
                } else if (health < 40) {
                    color = "bg-amber-500";
                    textStatus = "Segera Ganti";
                    bgBadge = "bg-amber-100 text-amber-700";
                }

                container.innerHTML += `
                    <div class="bg-white p-6 rounded-[2rem] card-shadow border border-slate-50">
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex items-center gap-3">
                                <div class="text-2xl">${cfg.icon}</div>
                                <div>
                                    <h3 class="font-bold text-slate-800 leading-tight">${cfg.name}</h3>
                                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Lalu: ${last.toLocaleString()} km</p>
                                </div>
                            </div>
                            <span class="text-[9px] font-black uppercase px-2 py-1 rounded-md ${bgBadge}">${textStatus}</span>
                        </div>
                        <div class="w-full h-2 bg-slate-100 rounded-full mb-4 overflow-hidden">
                            <div class="progress-bar h-full ${color}" style="width: ${health}%"></div>
                        </div>
                        <div class="flex justify-between items-end">
                            <div>
                                <p class="text-[10px] font-bold text-slate-400 uppercase mb-0.5">Sisa Jarak</p>
                                <p class="text-2xl font-black text-slate-800">${remain.toLocaleString()} <span class="text-xs font-medium text-slate-400">KM</span></p>
                            </div>
                            <button onclick="openReset('${key}')" class="bg-slate-900 text-white px-5 py-2 rounded-xl text-xs font-bold active:scale-90 transition">Reset</button>
                        </div>
                    </div>
                `;
            });
        }

        function updateCalculations() {
            const val = parseInt(document.getElementById('currentOdo').value);
            if (isNaN(val)) return;
            appData.currentOdo = val;
            saveAll();
            renderUI();
            showToast("Odometer Diperbarui");
        }

        function openReset(key) {
            activeKey = key;
            document.getElementById('modalTitle').innerText = `Update ${MAINTENANCE_CONFIG[key].name}`;
            document.getElementById('modalOdo').value = appData.currentOdo;
            document.getElementById('resetModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('resetModal').classList.add('hidden'); }

        function confirmReset() {
            const val = parseInt(document.getElementById('modalOdo').value);
            if (isNaN(val)) return;
            appData.history[activeKey] = val;
            appData.currentOdo = val;
            document.getElementById('currentOdo').value = val;
            saveAll();
            renderUI();
            closeModal();
            showToast("Berhasil Disimpan!");
        }

        function copyShareLink() {
            const base = window.location.href.split('?')[0];
            const dataStr = btoa(JSON.stringify(appData));
            const shareUrl = `${base}?data=${dataStr}`;
            
            const dummy = document.createElement('input');
            document.body.appendChild(dummy);
            dummy.value = shareUrl;
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);
            
            showToast("Link Backup Disalin!");
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.replace('opacity-0', 'opacity-100');
            setTimeout(() => t.classList.replace('opacity-100', 'opacity-0'), 2500);
        }
    </script>
</body>
</html>
